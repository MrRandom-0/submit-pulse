# ---------------------------------------------------------------------------
# Parameters (reusable)
# ---------------------------------------------------------------------------

  parameters:
    publicFormId:
      in: path
      name: publicFormId
      required: true
      description: |
        The form's public identifier. Format `fm_<random>`. Found in the
        Submit Pulse dashboard next to the endpoint URL. This is a public,
        unguessable identifier — not a secret. Do not treat it as an API key.
      schema:
        type: string
        pattern: "^fm_[A-Za-z0-9]{8,}$"
        example: "fm_a1b2c3d4e5f6a7b8"

    formId:
      in: path
      name: formId
      required: true
      schema:
        type: string
        format: uuid

    submissionId:
      in: path
      name: submissionId
      required: true
      schema:
        type: string

# ---------------------------------------------------------------------------
# Webhooks (OpenAPI 3.1 top-level webhooks field)
# ---------------------------------------------------------------------------

webhooks:

  submission.created:
    post:
      summary: New submission accepted
      description: |
        Fired asynchronously by the queue consumer after a submission is accepted,
        persisted, and passes the post-acceptance processing pipeline. Not fired for
        synthetic (health-check) submissions.

        **Delivery headers present on every webhook request:**
        - `x-submitpulse-signature: sha256=<hex>` — HMAC-SHA256 over `<timestamp>.<rawBody>`
        - `x-submitpulse-timestamp: <unix-seconds>` — for replay-window verification
        - `x-submitpulse-delivery-id: <uuid>` — unique per delivery attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["submission.created"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [submissionId, publicId, origin, spamVerdict, fields, submittedAt]
                  properties:
                    submissionId:
                      type: string
                      format: uuid
                    publicId:
                      type: string
                      example: "sub_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
                    origin:
                      type: string
                      example: "live"
                    spamVerdict:
                      type: string
                    fields:
                      type: object
                      additionalProperties: true
                    submittedAt:
                      type: string
                      format: date-time
            example:
              version: "v1"
              event: "submission.created"
              createdAt: "2025-06-01T12:00:00.000Z"
              workspaceId: "ws-uuid-here"
              formId: "form-uuid-here"
              data:
                submissionId: "sub-internal-uuid"
                publicId: "sub_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
                origin: "live"
                spamVerdict: "clean"
                fields:
                  name: "Alice Johnson"
                  email: "alice@example.com"
                  message: "Hello"
                submittedAt: "2025-06-01T12:00:00.000Z"
      responses:
        "200":
          description: Delivery acknowledged. Any 2xx response is treated as success.

  submission.updated:
    post:
      summary: Submission updated
      description: Fired when a submission's status, tags, assignment, or notes change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["submission.updated"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [submissionId, publicId, changes, updatedAt]
                  properties:
                    submissionId:
                      type: string
                    publicId:
                      type: string
                    changes:
                      type: object
                      additionalProperties: true
                      description: Only the fields that changed and their new values.
                    updatedAt:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Delivery acknowledged.

  submission.spam:
    post:
      summary: Submission classified as spam or blocked
      description: Fired by the async queue consumer after AI-based spam analysis finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["submission.spam"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [submissionId, publicId, spamVerdict, spamScore, signals, detectedAt]
                  properties:
                    submissionId:
                      type: string
                    publicId:
                      type: string
                    spamVerdict:
                      type: string
                      enum: [spam, blocked]
                    spamScore:
                      type: number
                      minimum: 0
                      maximum: 1
                    signals:
                      type: array
                      items:
                        type: object
                        required: [code, label, weight]
                        properties:
                          code:
                            type: string
                          label:
                            type: string
                          weight:
                            type: number
                          evidence:
                            type: string
                    detectedAt:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Delivery acknowledged.

  submission.restored:
    post:
      summary: Spam submission restored to clean
      description: Fired when a workspace member manually restores a spam-classified submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["submission.restored"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [submissionId, publicId, restoredBy, restoredAt]
                  properties:
                    submissionId:
                      type: string
                    publicId:
                      type: string
                    restoredBy:
                      type: string
                      description: "`user` or `system`"
                    restoredAt:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Delivery acknowledged.

  form.health.failed:
    post:
      summary: Health monitor run failed
      description: Fired when a Pulse Monitor synthetic health-check run fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["form.health.failed"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [healthMonitorId, healthRunId, failureStage, failureReason, consecutiveFailures, failedAt]
                  properties:
                    healthMonitorId:
                      type: string
                    healthRunId:
                      type: string
                    failureStage:
                      type: string
                    failureReason:
                      type: string
                    consecutiveFailures:
                      type: integer
                    incidentId:
                      type: string
                      description: Present when a new incident was opened for this failure.
                    failedAt:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Delivery acknowledged.

  form.schema.changed:
    post:
      summary: Schema drift detected
      description: Fired when a field change (rename, removal, type change) is detected relative to the stored schema version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, event, createdAt, workspaceId, formId, data]
              properties:
                version:
                  type: string
                  enum: ["v1"]
                event:
                  type: string
                  enum: ["form.schema.changed"]
                createdAt:
                  type: string
                  format: date-time
                workspaceId:
                  type: string
                  format: uuid
                formId:
                  type: string
                  format: uuid
                data:
                  type: object
                  required: [schemaDriftEventId, kind, detectedAt]
                  properties:
                    schemaDriftEventId:
                      type: string
                    kind:
                      type: string
                      description: Type of drift, e.g. `field_renamed`, `field_removed`, `field_added`.
                    fieldName:
                      type: string
                    previousDefinition:
                      type: object
                      additionalProperties: true
                    observedDefinition:
                      type: object
                      additionalProperties: true
                    detectedAt:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Delivery acknowledged.
